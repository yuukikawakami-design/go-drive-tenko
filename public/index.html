<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>自動点呼 QRスキャン</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Hiragino Sans', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #1e293b;
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* ── モード切り替えトグル ── */
    .mode-toggle {
      display: flex;
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: #64748b;
    }

    .mode-btn.active-pre {
      background: #0ea5e9;
      color: white;
    }

    .mode-btn.active-post {
      background: #f97316;
      color: white;
    }

    /* ── スキャン画面 ── */
    #screen-scan {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 20px;
      gap: 16px;
    }

    #reader-wrapper {
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }

    #reader-wrapper.mode-pre { border: 2px solid #38bdf8; }
    #reader-wrapper.mode-post { border: 2px solid #f97316; box-shadow: 0 0 30px rgba(249, 115, 22, 0.3); }

    #reader { width: 100%; }
    #reader > * { border: none !important; }
    #reader img { display: none !important; }
    #html5-qrcode-button-camera-permission,
    #html5-qrcode-button-camera-stop,
    #html5-qrcode-button-camera-start { display: none !important; }

    .scan-hint {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
    }

    .scan-hint span {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 16px;
    }

    /* ── 結果画面 ── */
    #screen-result {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 24px 20px;
      gap: 20px;
    }

    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .result-card .icon { font-size: 48px; margin-bottom: 8px; }

    .result-card .driver-name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .result-card .driver-name.pre { color: #38bdf8; }
    .result-card .driver-name.post { color: #f97316; }

    .result-card .label { font-size: 13px; color: #64748b; margin-bottom: 16px; }

    .result-card .info-box {
      font-size: 16px;
      color: #e2e8f0;
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .result-card .info-box .info-label {
      font-size: 11px;
      color: #64748b;
      display: block;
      margin-bottom: 2px;
    }

    .result-card .mode-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .result-card .mode-badge.pre { background: #0c4a6e; color: #38bdf8; }
    .result-card .mode-badge.post { background: #431407; color: #f97316; }

    /* カウントダウン（業務前のみ表示） */
    .countdown-wrapper {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .countdown-label { font-size: 13px; color: #64748b; margin-bottom: 8px; }

    .countdown-timer {
      font-size: 52px;
      font-weight: 800;
      color: #f59e0b;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
    }

    .countdown-timer.done { color: #22c55e; }

    .progress-bar {
      margin-top: 12px;
      height: 6px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      border-radius: 999px;
      transition: width 1s linear;
      width: 100%;
    }

    /* ボタン */
    .btn {
      width: 100%;
      max-width: 380px;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
    }

    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-danger { background: #1e293b; border: 1px solid #ef4444; color: #ef4444; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.error { background: #ef4444; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1 id="header-title">業務前点呼 QRスキャン</h1>
  <p>自分のQRコードを読み込んでください</p>
</header>

<!-- スキャン画面 -->
<div id="screen-scan">
  <!-- モード切り替え -->
  <div class="mode-toggle">
    <button class="mode-btn active-pre" id="btn-mode-pre" onclick="setMode('pre')">🚗 業務前点呼</button>
    <button class="mode-btn" id="btn-mode-post" onclick="setMode('post')">🏁 終業後点呼</button>
  </div>

  <div id="reader-wrapper" class="mode-pre">
    <div id="reader"></div>
  </div>
  <div class="scan-hint">
    <span>📷 カメラにQRコードを向けてください</span>
  </div>
</div>

<!-- 結果画面 -->
<div id="screen-result">
  <div class="result-card">
    <div class="icon">✅</div>
    <div class="mode-badge pre" id="result-badge">業務前点呼</div>
    <div class="driver-name pre" id="result-name">－</div>
    <div class="label" id="result-label">のQRコードを読み込みました</div>
    <div class="info-box" id="result-info-box">
      <span class="info-label" id="result-info-label">業務開始予定日時</span>
      <strong id="result-time">－</strong>
    </div>
  </div>

  <!-- 業務前のみ表示するカウントダウン -->
  <div class="countdown-wrapper" id="countdown-wrapper">
    <div class="countdown-label">点呼予定が自動登録されるまで</div>
    <div class="countdown-timer" id="countdown">5:00</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="resetToScan()">別のQRコードをスキャン</button>
  <button class="btn btn-danger" onclick="cancelScan()">キャンセル</button>
</div>

<div class="toast" id="toast"></div>

<script>
  let countdownInterval = null;
  let countdownSeconds = 0;
  let totalSeconds = 0;
  let currentQrCode = null;
  let currentMode = 'pre'; // 'pre' or 'post'

  function setMode(mode) {
    currentMode = mode;
    const isPre = mode === 'pre';

    document.getElementById('btn-mode-pre').className = 'mode-btn' + (isPre ? ' active-pre' : '');
    document.getElementById('btn-mode-post').className = 'mode-btn' + (!isPre ? ' active-post' : '');
    document.getElementById('reader-wrapper').className = 'mode-' + mode;
    document.getElementById('header-title').textContent = isPre ? '業務前点呼 QRスキャン' : '終業後点呼 QRスキャン';
  }

  // QRスキャナー初期化
  const html5QrCode = new Html5Qrcode('reader');
  const qrConfig = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1 };

  async function startScanner() {
    try {
      await html5QrCode.start({ facingMode: 'environment' }, qrConfig, onScanSuccess, () => {});
    } catch (err) {
      showToast('カメラの起動に失敗しました', true);
    }
  }

  async function stopScanner() {
    try {
      if (html5QrCode.isScanning) await html5QrCode.stop();
    } catch (_) {}
  }

  async function onScanSuccess(qrCode) {
    if (currentQrCode === qrCode) return;
    currentQrCode = qrCode;

    if (navigator.vibrate) navigator.vibrate(100);
    await stopScanner();

    try {
      const res = await fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qrCode, type: currentMode }),
      });

      const data = await res.json();

      if (!data.success) {
        showToast(data.error || 'エラーが発生しました', true);
        currentQrCode = null;
        startScanner();
        return;
      }

      // 結果画面を更新
      const isPre = data.type === 'pre';
      const nameEl = document.getElementById('result-name');
      const badgeEl = document.getElementById('result-badge');

      nameEl.textContent = data.driverName;
      nameEl.className = 'driver-name ' + (isPre ? 'pre' : 'post');

      badgeEl.textContent = isPre ? '業務前点呼' : '終業後点呼';
      badgeEl.className = 'mode-badge ' + (isPre ? 'pre' : 'post');

      if (isPre) {
        const st = new Date(data.scheduledTime);
        document.getElementById('result-info-label').textContent = '業務開始予定日時';
        document.getElementById('result-time').textContent = formatJP(st);
        document.getElementById('countdown-wrapper').style.display = 'block';
        showResultScreen(data.delayMinutes * 60);
      } else {
        document.getElementById('result-info-label').textContent = '退勤時刻';
        document.getElementById('result-time').textContent = data.endTime + ' に設定しました';
        document.getElementById('countdown-wrapper').style.display = 'none';
        showResultScreen(0);
        showToast('終業時刻を登録しました ✅');
      }

    } catch (err) {
      showToast('サーバーへの接続に失敗しました', true);
      currentQrCode = null;
      startScanner();
    }
  }

  function showResultScreen(seconds) {
    document.getElementById('screen-scan').style.display = 'none';
    document.getElementById('screen-result').style.display = 'flex';

    clearInterval(countdownInterval);
    if (seconds <= 0) return;

    totalSeconds = seconds;
    countdownSeconds = seconds;
    updateCountdown();

    countdownInterval = setInterval(() => {
      countdownSeconds--;
      updateCountdown();
      if (countdownSeconds <= 0) {
        clearInterval(countdownInterval);
        document.getElementById('countdown').classList.add('done');
        document.getElementById('countdown').textContent = '登録完了！';
        document.getElementById('progress-fill').style.width = '0%';
        showToast('点呼予定を登録しました ✅');
      }
    }, 1000);
  }

  function updateCountdown() {
    const m = Math.floor(countdownSeconds / 60);
    const s = String(countdownSeconds % 60).padStart(2, '0');
    document.getElementById('countdown').textContent = `${m}:${s}`;
    const pct = (countdownSeconds / totalSeconds) * 100;
    document.getElementById('progress-fill').style.width = `${pct}%`;
  }

  function resetToScan() {
    clearInterval(countdownInterval);
    currentQrCode = null;
    document.getElementById('screen-result').style.display = 'none';
    document.getElementById('screen-scan').style.display = 'flex';
    document.getElementById('countdown').classList.remove('done');
    startScanner();
  }

  function cancelScan() {
    resetToScan();
    showToast('キャンセルしました');
  }

  function formatJP(date) {
    return date.toLocaleString('ja-JP', {
      year: 'numeric', month: 'long', day: 'numeric',
      weekday: 'short', hour: '2-digit', minute: '2-digit',
    });
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '') + ' show';
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  startScanner();
</script>

</body>
</html>
